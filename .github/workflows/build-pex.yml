name: build-pex

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Tag to use for release (not used here, kept for symmetry)"
        required: false
        type: string
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pex:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, macos-15-intel]
        py: ["3.11"]
    runs-on: ${{ matrix.os }}
    env:
      PEX_VERBOSE: "9"
      PEX_IGNORE_RCFILES: "1"
      PIP_NO_INPUT: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PEX_VERSION: "2.74.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install build tools (pinned)
        run: |
          python -m pip install -U "pip>=24,<26"
          pip install "build==1.2.1" "pex==${{ env.PEX_VERSION }}"

      - name: Build wheel
        run: |
          python -m build --wheel
          ls -l dist

      - name: Build PEX
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-15-intel) OS_OUT="k2p-macos-x86_64.pex" ;;
            macos-latest)   OS_OUT="k2p-macos-arm64.pex" ;;
            ubuntu-22.04)   OS_OUT="k2p-linux.pex" ;;
          esac

          VENV_FLAGS="--venv prepend --strip-pex-env"
          VALIDATE="--validate-entry-point"

          pex dist/*.whl \
            -c k2p \
            -o "dist/${OS_OUT}" \
            ${VENV_FLAGS} \
            ${VALIDATE} \
            --interpreter-constraint 'CPython==3.11.*'

          echo "Produced dist/${OS_OUT}"
          ls -l dist

      - name: Smoke test PEX (Unix, --version; quiet, robust)
        shell: bash
        env:
          PEX_ROOT: ${{ github.workspace }}/.pex_root
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p "$PEX_ROOT"

          for f in dist/*.pex; do
            echo "CLI version test $f"

            # Run quietly: no verbose diagnostics, and keep stderr separate.
            # Also ignore PEX_VERSION to avoid the “Ignoring …” warning.
            if out=$(env -u PEX_VERSION PEX_VERBOSE=0 "$f" --version 1>stdout.txt 2>stderr.txt; echo $?); then :; fi
            status=$(tail -n1 <<<"$out")

            # Fallback to python launcher if direct exec failed
            if [ "$status" -ne 0 ]; then
              if out=$(env -u PEX_VERSION PEX_VERBOSE=0 python3 "$f" --version 1>stdout.txt 2>stderr.txt; echo $?); then :; fi
              status=$(tail -n1 <<<"$out")
            fi

            echo "--- stdout ---"
            sed -e 's/^/  /' stdout.txt || true
            echo "--- stderr ---"
            sed -e 's/^/  /' stderr.txt || true

            # Validate last stdout line only
            last=$(tail -n1 stdout.txt | tr -d '\r')
            if [[ "$status" -ne 0 ]]; then
              echo "PEX exited non-zero ($status) running $f" >&2
              exit "$status"
            fi
            if [[ "$last" =~ ^k2p[[:space:]][0-9]+(\.[0-9]+)*([A-Za-z0-9._-]+)?\'?$ ]]; then
              echo "OK: $last"
            else
              echo "Unexpected --version stdout (last line): >>>$last<<<" >&2
              exit 1
            fi
          done


      - name: Upload PEX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pex-${{ matrix.os }}
          path: dist/*.pex
          if-no-files-found: error
