name: release-exe

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write

jobs:
  build-windows-exe:
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build toolchain
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # Install your project and its deps (ensures hidden imports are present)
          pip install -e .
          # Builders
          pip install pyinstaller==6.* nuitka==2.* ordered-set zstandard

      - name: Create entry script
        shell: pwsh
        run: |
          Set-Content -Path k2p_entry.py -Encoding UTF8 -NoNewline -Value @(
          'from knime2py.cli import main'
          ''
          'if __name__ == "__main__":'
          '    raise SystemExit(main())'
          )


      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --name k2p-pyinstaller k2p_entry.py

      - name: Build with Nuitka
        shell: pwsh
        run: |
          python -m nuitka --onefile --assume-yes-for-downloads ^
            --output-filename=k2p-nuitka.exe k2p_entry.py

      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-exe | Out-Null
          Move-Item .\dist\k2p-pyinstaller.exe .\dist-exe\k2p-pyinstaller.exe
          Move-Item .\k2p-nuitka.exe           .\dist-exe\k2p-nuitka.exe
          Get-ChildItem .\dist-exe

      # Optional: pass outputs to the next job. This artifact download will unzip on the runner,
      # but the final Release assets will be uploaded as raw .exe files.
      - name: Upload exe artifact (for handoff)
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-exe/*

  release:
    needs: build-windows-exe
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows-exe

      - name: Compute tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "PRERELEASE=false"       >> "$GITHUB_OUTPUT"
          else
            echo "TAG=nightly-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "PRERELEASE=true"                  >> "$GITHUB_OUTPUT"
          fi

      - name: Publish raw .exe files to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          prerelease: ${{ steps.tag.outputs.PRERELEASE }}
          files: |
            artifacts/windows-exe/k2p-pyinstaller.exe
            artifacts/windows-exe/k2p-nuitka.exe
