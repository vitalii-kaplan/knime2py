name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: |
          pip install .
          pip install ".[dev]"
          pip install ".[ml-examples]"

      - name: Run tests with coverage
        run: |
          pytest --cov=knime2py --cov-report=xml:coverage.xml

      - name: Upload coverage.xml as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Generate coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          format: 'markdown'
          output: 'both'        # writes summary to console and to file
          thresholds: '60 80'   # optional: <warning%> <ok%>

      - name: Add coverage summary as PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: code-coverage-results.md
