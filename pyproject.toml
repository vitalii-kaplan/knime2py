[project]
name = "knime2py"
dynamic = ["version"]
description = "KNIME → Python workbook converter (graphs, DOT, and ipynb/py emitters)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vitalii Kaplan", email = "vitalii.v.kaplan@gmail.com" }]

# Only what the CLI needs at runtime.
dependencies = [
  "lxml>=6.1,<7",
  "jinja2>=3.1,<4",
  "networkx>=3.2,<4",
  "packaging>=23,<25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "types-lxml>=2024.2.6",
  "openpyxl>=3.1.0"
]
rag = [
  "sentence-transformers>=2.6,<3",
  "chromadb>=0.5",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "protobuf<5",
  "tenacity<9",
]
viz = ["graphviz>=0.20"]
ml-examples = [
  "pandas>=1.5,<3.0",
  "numpy>=1.23,<2.0",
  "scipy>=1.10,<1.13",
  "scikit-learn>=1.4.2,<1.6",
  "imbalanced-learn>=0.12.3,<0.13",
  "matplotlib>=3.6",
  "protobuf<5",
]

[project.scripts]
k2p = "knime2py.cli:main"
knime2py = "knime2py.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# Tell Hatch where to read the version from
[tool.hatch.version]
path = "src/knime2py/__init__.py"

# Proper Hatch package include (from src layout)
[tool.hatch.build.targets.wheel]
packages = ["src/knime2py"]

[tool.pytest.ini_options]
addopts = "--cov-config=pyproject.toml --cov=knime2py --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
parallel = true
# Point directly at the src path so Coverage doesn't have to import the package to locate it.
source = ["src/knime2py"]

[tool.coverage.paths]
# Tell Coverage that these refer to the same code, so subprocesses importing an installed package
# still merge into the same filename keys.
knime2py = [
  "src/knime2py",
  "*/site-packages/knime2py"
]

[tool.coverage.report]
show_missing = true
skip_empty = true
omit = [
  "*/knime2py/__init__.py",
  "*/knime2py/__main__.py",
  "*/knime2py/**/__init__.py",
]

[tool.coverage.xml]
output = "coverage.xml"
